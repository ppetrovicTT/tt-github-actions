name: AI Run Summary
description: Aggregate per-job AI summaries into a run-level report

inputs:
  config-path:
    description: "Path to workflow config YAML (same config used by ai_job_summary)"
    required: true
  api-key:
    description: "LLM API key (optional — set model: none in analysis config to skip LLM)"
    required: false
    default: ""
  api-url:
    description: "LLM API URL (optional)"
    required: false
    default: ""
  slack-bot-token:
    description: "Slack bot token (skip Slack if empty)"
    required: false
    default: ""
  slack-channel-id:
    description: "Slack channel ID (skip Slack if empty)"
    required: false
    default: ""
  matrix-manifest:
    description: "Artifact name containing matrix_manifest.json (list of expected job names). If set, jobs with no summary are stubbed as INFRA_FAILURE."
    required: false
    default: ""

outputs:
  report-file:
    description: "Path to the generated .md report."
    value: ${{ steps.summarize.outputs.report_file }}

runs:
  using: composite
  steps:
    - name: Resolve config paths
      id: config
      shell: bash
      run: |
        CONFIG_PATH="${{ inputs.config-path }}"
        [[ "$CONFIG_PATH" != /* ]] && CONFIG_PATH="$GITHUB_WORKSPACE/$CONFIG_PATH"
        if [ ! -f "$CONFIG_PATH" ]; then
          echo "::error::Config file not found: $CONFIG_PATH"
          exit 1
        fi
        echo "config_path=$CONFIG_PATH" >> "$GITHUB_OUTPUT"

        if python3 -c "import yaml,sys; c=yaml.safe_load(open(sys.argv[1])); sys.exit(1 if 'tool_dir' in c else 0)" "$CONFIG_PATH" 2>/dev/null; then
          :
        else
          echo "::error::tool_dir is no longer supported. The action resolves the tool path automatically."
          exit 1
        fi

        CONFIG_VALS=$(python3 -c "import sys,yaml;c=yaml.safe_load(open(sys.argv[1]));rs=c.get('run_summary',{});print(rs.get('summary_dir',''));print(rs.get('output_dir',''))" "$CONFIG_PATH") || {
          echo "::error::Failed to parse config YAML: $CONFIG_PATH"
          exit 1
        }
        SUMMARY_DIR=$(echo "$CONFIG_VALS" | sed -n '1p')
        OUTPUT_DIR=$(echo "$CONFIG_VALS" | sed -n '2p')

        if [ -z "$SUMMARY_DIR" ]; then echo "::error::run_summary.summary_dir not defined in $CONFIG_PATH"; exit 1; fi
        if [ -z "$OUTPUT_DIR" ];  then echo "::error::run_summary.output_dir not defined in $CONFIG_PATH"; exit 1; fi

        TOOL_DIR="$(realpath "${GITHUB_ACTION_PATH}/../../../tools/ai-summary")"
        if [ ! -f "$TOOL_DIR/pyproject.toml" ]; then
          echo "::error::Tool not found at $TOOL_DIR (missing pyproject.toml)"
          exit 1
        fi

        [[ "$SUMMARY_DIR" != /* ]] && SUMMARY_DIR="$GITHUB_WORKSPACE/$SUMMARY_DIR"
        [[ "$OUTPUT_DIR"  != /* ]] && OUTPUT_DIR="$GITHUB_WORKSPACE/$OUTPUT_DIR"

        echo "tool_dir=$TOOL_DIR"       >> "$GITHUB_OUTPUT"
        echo "summary_dir=$SUMMARY_DIR" >> "$GITHUB_OUTPUT"
        echo "output_dir=$OUTPUT_DIR"   >> "$GITHUB_OUTPUT"

    - name: Download AI job summaries
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: ai_job_summary_*
        path: ${{ steps.config.outputs.summary_dir }}
        merge-multiple: true

    - name: Download matrix manifest
      if: inputs.matrix-manifest != ''
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ inputs.matrix-manifest }}
        path: /tmp/ai_manifest

    - name: Set venv path
      shell: bash
      run: echo "AI_SUMMARY_VENV=/tmp/ai-summary-venv" >> "$GITHUB_ENV"

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install Puppeteer
      if: inputs.slack-bot-token != '' && inputs.slack-channel-id != ''
      shell: bash
      run: npm install puppeteer

    - name: Generate run summary
      id: summarize
      shell: bash
      env:
        TT_CHAT_API_KEY: ${{ inputs.api-key }}
        TT_CHAT_URL: ${{ inputs.api-url }}
      run: |
        CONFIG_PATH="${{ steps.config.outputs.config_path }}"
        TOOL_DIR="${{ steps.config.outputs.tool_dir }}"

        export UV_PROJECT_ENVIRONMENT="$AI_SUMMARY_VENV"
        uv --directory "$TOOL_DIR" sync --quiet --no-editable

        STDERR_FILE=$(mktemp)
        trap 'rm -f "$STDERR_FILE"' EXIT

        CMD_ARGS=(--config "$CONFIG_PATH")
        [ -f "/tmp/ai_manifest/matrix_manifest.json" ] && CMD_ARGS+=(--manifest "/tmp/ai_manifest/matrix_manifest.json")

        export UV_PROJECT_ENVIRONMENT="$AI_SUMMARY_VENV"
        echo "::group::AI Run Summary"
        uv run --project "$TOOL_DIR" ai-run-summary "${CMD_ARGS[@]}" 2> >(tee "$STDERR_FILE" >&2) || {
          echo "::endgroup::"
          echo "::warning::ai-run-summary failed, check logs"
          echo "report_file=" >> "$GITHUB_OUTPUT"
          exit 0
        }
        echo "::endgroup::"

        REPORT_FILE=$(grep -m 1 "^Report written to:" "$STDERR_FILE" | sed 's/Report written to: //')
        if [ -z "$REPORT_FILE" ] || [ ! -f "$REPORT_FILE" ]; then
          echo "::warning::Could not locate report file"
          echo "report_file=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

    - name: Upload run summary
      if: always() && !cancelled() && steps.summarize.outputs.report_file != ''
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ai_run_summary_${{ github.run_id }}
        path: ${{ steps.summarize.outputs.report_file }}

    - name: Render report image
      id: render
      if: >-
        always() && !cancelled()
        && steps.summarize.outputs.report_file != ''
        && inputs.slack-bot-token != ''
        && inputs.slack-channel-id != ''
      continue-on-error: true
      shell: bash
      env:
        REPORT_FILE: ${{ steps.summarize.outputs.report_file }}
      run: |
        HTML_FILE="${REPORT_FILE%.md}.html"
        PNG_FILE="/tmp/ai_run_summary.png"
        if [ ! -f "$HTML_FILE" ]; then
          echo "::warning::HTML report not found: $HTML_FILE"
          exit 0
        fi
        node -e "
        const puppeteer = require('puppeteer');
        (async () => {
          const browser = await puppeteer.launch({args: ['--no-sandbox']});
          const page = await browser.newPage();
          await page.setViewport({width: 1400, height: 800, deviceScaleFactor: 2});
          await page.goto('file://' + require('path').resolve(process.argv[1]), {waitUntil: 'networkidle0'});
          const body = await page.\$('body');
          await body.screenshot({path: process.argv[2], type: 'png'});
          await browser.close();
        })();
        " "$HTML_FILE" "$PNG_FILE" || { echo "::warning::Puppeteer failed"; exit 0; }
        [ -s "$PNG_FILE" ] && echo "png_file=$PNG_FILE" >> "$GITHUB_OUTPUT" || echo "::warning::Puppeteer produced empty PNG"

    - name: Send Slack notification
      if: >-
        always() && !cancelled()
        && steps.render.outputs.png_file != ''
      continue-on-error: true
      uses: slackapi/slack-github-action@v3
      with:
        method: files.uploadV2
        token: ${{ inputs.slack-bot-token }}
        payload: |
          channel_id: "${{ inputs.slack-channel-id }}"
          initial_comment: "🤖 AI Run Summary\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          file: "${{ steps.render.outputs.png_file }}"
          filename: "ai_run_summary.png"

    - name: Cleanup temporary files
      if: always()
      shell: bash
      env:
        REPORT_FILE: ${{ steps.summarize.outputs.report_file }}
      run: |
        rm -f "${{ steps.render.outputs.png_file }}"
        [ -n "$REPORT_FILE" ] && rm -f "${REPORT_FILE%.md}.html"
        rm -rf "$AI_SUMMARY_VENV"
